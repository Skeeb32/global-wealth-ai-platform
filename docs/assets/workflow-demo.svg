<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img" aria-labelledby="title desc">
<title id="title">A 100 USD discrepancy, from calculation to review</title><desc id="desc">Real synthetic CLI output: actual 1000000.00 USD, expected 999900.00 USD, discrepancy 100.00 USD; a reviewer rejects the run and the original discrepancy remains recorded.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071220"/><stop offset="1" stop-color="#102b38"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7fd8d1" stroke-opacity="0.045"/></pattern></defs>
<rect width="1200" height="606" rx="22" fill="url(#bg)"/><rect width="1200" height="606" rx="22" fill="url(#grid)"/>
<rect x="28" y="28" width="1144" height="550" rx="16" fill="#09131f" stroke="#2b4254"/><circle cx="56" cy="55" r="6" fill="#fb7185"/><circle cx="80" cy="55" r="6" fill="#fbbf24"/><circle cx="104" cy="55" r="6" fill="#5eead4"/><text xml:space="preserve" x="133" y="61" fill="#91a9bd" font-family="Arial, sans-serif" font-size="16" font-weight="400">wealth_platform   /   CLI output · selected fields</text><path d="M28 80H1172" stroke="#2b4254"/><text xml:space="preserve" x="56" y="120" fill="#5eead4" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">$ python -m wealth_platform run examples/exception.json …</text><text xml:space="preserve" x="56" y="154" fill="#d9e5ef" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  run_id          showcase-exception</text><text xml:space="preserve" x="56" y="188" fill="#d9e5ef" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  actual          1000000.00 USD</text><text xml:space="preserve" x="56" y="222" fill="#d9e5ef" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  expected        999900.00 USD</text><text xml:space="preserve" x="56" y="256" fill="#fbbf24" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  delta           +100.00 USD</text><text xml:space="preserve" x="56" y="290" fill="#fbbf24" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  reconciliation  exception</text><text xml:space="preserve" x="56" y="324" fill="#d9e5ef" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  state           pending_review</text><text xml:space="preserve" x="56" y="358" fill="#d9e5ef" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400"></text><text xml:space="preserve" x="56" y="392" fill="#5eead4" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">$ python -m wealth_platform review showcase-exception …</text><text xml:space="preserve" x="56" y="426" fill="#fb7185" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  decision        rejected</text><text xml:space="preserve" x="56" y="460" fill="#d9e5ef" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  reviewer        reviewer</text><text xml:space="preserve" x="56" y="494" fill="#fbbf24" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="400">  original delta  +100.00 USD · retained</text><text xml:space="preserve" x="56" y="554" fill="#91a9bd" font-family="Arial, sans-serif" font-size="16" font-weight="400">Real fixture results. Reformatted for readability; full commands are in the README.</text>
</svg>